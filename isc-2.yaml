apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
archiveSize: 32
mirror:
  platform:
    platforms:
      - architecture: amd64
        os: linux
    channels:
      # Step 1: Bridge source version in 4.19
      - name: stable-4.19
        minVersion: 4.19.20
        maxVersion: 4.19.20
        type: ocp

      # Step 2: Direct target version in 4.20 (Pin to your desired z-stream, e.g., 4.20.5)
      - name: stable-4.20
        minVersion: 4.20.5
        maxVersion: 4.20.5
        type: ocp

  operators:
    # --- Red Hat Operators Index (v4.20) ---
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
      packages:
        - name: kubernetes-nmstate-operator
        - name: kubevirt-hyperconverged
        - name: lvms-operator
        - name: nfd
        - name: openshift-gitops-operator
        - name: openshift-pipelines-operator-rh
        - name: rhbk-operator
        - name: rhods-operator             # OpenShift AI
        - name: serverless-operator
        - name: servicemeshoperator

    # --- Certified Operators Index (v4.20) ---
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.20
      packages:
        - name: gpu-operator-certified

    # --- Community Operators Index (v4.20) ---
    - catalog: registry.redhat.io/redhat/community-operator-index:v4.20
      packages:
        - name: opendatahub-operator